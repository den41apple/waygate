# Внутренний nginx внутри frontend-контейнера. Только статика.
# Edge-nginx (deploy/nginx.conf) проксирует / сюда, а /api и /ws — на server-контейнер.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: любой путь без файла отдаёт index.html, чтобы клиентский router работал
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кешируем хешированные ассеты Vite агрессивно
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
