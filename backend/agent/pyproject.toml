[project]
name = "waygate-agent"
version = "0.1.11"
requires-python = ">=3.11"
# `waygate-shared` намеренно НЕ в зависимостях — он vendored внутрь wheel'а
# через симлинку `agent/shared -> ../shared`. На target-сервере нет workspace,
# и pip не нашёл бы локальный пакет, поэтому везём `shared` собой.
dependencies = [
  "fastapi>=0.115",
  "granian>=1.6",
  "aiohttp>=3.10",
  "envparse>=0.2",
  "apscheduler>=4.0a5",
  "acme>=2.11",
  "cryptography>=43",
  "loguru>=0.7",
  "pydantic>=2.9",
  "prometheus-fastapi-instrumentator>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "shared"]
package-dir = {"agent" = ".", "shared" = "shared"}
