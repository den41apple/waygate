name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync workspace
        working-directory: backend
        run: uv sync --all-packages

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy
        working-directory: backend
        run: uv run mypy .

      - name: Pytest
        working-directory: backend
        run: uv run pytest -v

      - name: OpenAPI schema is in sync
        working-directory: backend
        run: |
          uv run python -m server.scripts.dump_openapi > server/openapi.json.fresh
          if ! diff -u server/openapi.json server/openapi.json.fresh; then
            echo "::error::server/openapi.json устарел. Запустите 'uv run python -m server.scripts.dump_openapi > server/openapi.json' и закоммитьте."
            exit 1
          fi
          rm server/openapi.json.fresh

      - name: Upload openapi.json
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: backend/server/openapi.json
          retention-days: 7

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    needs: backend  # нужен openapi.json артефакт
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated TS types are in sync
        working-directory: frontend
        run: |
          npm run generate-types
          if ! git diff --exit-code src/api/openapi.ts; then
            echo "::error::src/api/openapi.ts устарел — запустите 'npm run generate-types' и закоммитьте."
            exit 1
          fi

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync backend workspace
        working-directory: backend
        run: uv sync --all-packages

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
