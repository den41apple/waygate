# Edge-nginx: TLS-терминатор + reverse proxy + базовая защита.
#
# Раздаёт:
#   /api/*  → server:8000  (REST API control-plane)
#   /ws/*   → server:8000  (WebSocket с Upgrade-headers)
#   /       → frontend:80  (Vite-статика)
#
# Для HTTPS подложите cert.pem и key.pem в ./tls/ и раскомментируйте 443-блок.

upstream control_plane {
    server server:8000;
    keepalive 16;
}

upstream waygate_frontend {
    server frontend:80;
}

# Map для безопасного проброса Upgrade-заголовка в WS-проксировании
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting: ws-token берёт каждый коннект, провижионинг — тяжёлая операция.
limit_req_zone $binary_remote_addr zone=waygate_ws_token:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=waygate_provision:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=waygate_api:10m rate=60r/s;

server {
    listen 80 default_server;
    server_name _;

    # Безопасность по умолчанию для всех ответов
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;

    # Дросселим выдачу WS-токенов
    location = /api/v1/auth/ws-token {
        limit_req zone=waygate_ws_token burst=5 nodelay;
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Провижионинг — тяжёлый, ограничиваем явно. Точное совпадение — POST на /provision.
    location = /api/v1/servers/provision {
        limit_req zone=waygate_provision burst=2 nodelay;
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE для онбординга — без буферизации, таймауты выкручены
    location ~ ^/api/v1/servers/[0-9]+/provision/stream$ {
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   Connection       "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
    }

    # /api/v1/... → control-plane (общий лимит)
    location /api/ {
        limit_req zone=waygate_api burst=120 nodelay;
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Всё остальное — статика frontend
    location / {
        proxy_pass http://waygate_frontend;
        proxy_set_header Host $host;
    }
}

# Раскомментируйте для HTTPS — положите ./tls/cert.pem и ./tls/key.pem.
# Не забудьте также раскомментировать redirect-блок в server-on-80 выше.
#
# server {
#     listen 443 ssl http2;
#     server_name _;
#
#     ssl_certificate     /etc/nginx/tls/cert.pem;
#     ssl_certificate_key /etc/nginx/tls/key.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     # ... + повторите остальные add_header и location-блоки
# }
