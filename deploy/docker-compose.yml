# Production-стек Waygate control-plane.
#
# Запуск:
#   cp .env.example .env  # заполнить пароли/секреты
#   docker compose up -d --build
#
# Открыть http://localhost (или http://${WAYGATE_HOST}). Для HTTPS см. nginx.conf.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: waygate
      POSTGRES_USER: waygate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waygate -d waygate"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: backend/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://waygate:${POSTGRES_PASSWORD}@postgres:5432/waygate
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан в .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://${WAYGATE_HOST:-localhost}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_WHEEL_URL: ${AGENT_WHEEL_URL:-https://github.com/den41apple/waygate/releases/latest/download/waygate_agent-py3-none-any.whl}
      WAYGATE_ADMIN_USER: ${WAYGATE_ADMIN_USER:-}
      WAYGATE_ADMIN_PASSWORD: ${WAYGATE_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Положите сюда cert.pem и key.pem чтобы включить TLS на 443
      - ./tls:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - frontend

volumes:
  pgdata:
